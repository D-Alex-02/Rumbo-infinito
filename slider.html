<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
    <link rel="stylesheet" href="Estilos/estilos2.css">
    <link rel="icon" href="./imagenes/icono-paginaweb.png" type="image/png">
    <style>
        
    </style>
</head>
<body>
    <nav class="breadcrumb">
        <a href="index.html">Regresar</a>
    </nav>

    <div class="container">
        <div class="slider-container">
            <div class="slides">
                <div class="slide"><img src="imagenes/2.jpg" alt="Imagen 1"></div>
                <div class="slide"><img src="imagenes/3.jpg" alt="Imagen 2"></div>
                <div class="slide"><img src="imagenes/4.jpg" alt="Imagen 3"></div>
            </div>
            <button class="prev" onclick="moveSlide(-1)">&#10094;</button>
            <button class="next" onclick="moveSlide(1)">&#10095;</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Rumbo infinito | Contacto: info@rumboinfinito.com | Tel: +57 300 123 4567</p>
        <p>Diego Alexander Guerrero Villota</p>
    </footer>

    <script>
        let currentIndex = 0;
        const slides = document.querySelector('.slides');
        const totalSlides = document.querySelectorAll('.slide').length;

        function moveSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = totalSlides - 1;
            } else if (currentIndex >= totalSlides) {
                currentIndex = 0;
            }
            slides.style.transform = `translateX(-${currentIndex * 100}%)`;
        }
    </script>
</body>
</html>
